<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Install Little Shop</title><link rel="icon" href="./favicon.svg"><style>body{margin:0;padding:60px 24px;background:#f7f8fa;color:#203d30;font:18px Arial,sans-serif}main{max-width:560px;margin:auto;padding:36px;background:white;border:1px solid #dce3e5;border-radius:20px}h1{font-size:28px}p{line-height:1.7}a{color:#126448}</style></head><body><main><h1>Little Shop</h1><p id="status">Preparing the app for offline use. Keep this page open while connected to the internet.</p><p id="fallback" hidden><a href="./index.html">Try again</a></p></main><script>
// Installs the offline app. Uses relative paths so it works from any web address or sub-folder.
(async()=>{const status=document.getElementById('status');try{if(!('serviceWorker'in navigator))throw Error('Open this link in Safari on your iPad.');const reg=await navigator.serviceWorker.register('./offline/sw.js',{scope:'./offline/',updateViaCache:'none'});if(reg.active)await reg.update();const worker=reg.installing||reg.waiting||reg.active;if(!worker)throw Error('The app could not be installed.');if(worker.state!=='activated')await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('The installation did not finish. Check your connection and try again.')),20000);const changed=()=>{if(worker.state==='activated'){clearTimeout(timer);resolve()}else if(worker.state==='redundant'){clearTimeout(timer);reject(Error('The app could not be downloaded. Check your connection and try again.'))}};worker.addEventListener('statechange',changed);changed();});location.replace('./offline/');}catch(e){status.textContent=e.message||'Please reopen this page while online.';document.getElementById('fallback').hidden=false;}})();
</script></body></html>
